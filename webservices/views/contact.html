<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | E.S Company</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <style>* { font-family: 'Inter', sans-serif; } .gradient-text { background: linear-gradient(135deg, #0066FF 0%, #00ccff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; } .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: #25D366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; z-index: 100; }</style>
</head>
<body>
    <nav class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md shadow-sm py-4">
        <div class="container mx-auto px-4 md:px-8">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3"><img src="https://i.postimg.cc/Pq9DZ0jn/file-000000001f3471fda269be0d033dc40a.png" class="w-10 h-10 rounded-lg"><span class="font-bold text-xl gradient-text">E.S Company</span></div>
                <div class="hidden md:flex gap-6"><a href="/" class="text-gray-600 hover:text-[#0066FF]">Accueil</a><a href="/services" class="text-gray-600 hover:text-[#0066FF]">Services</a><a href="/portfolio" class="text-gray-600 hover:text-[#0066FF]">Portfolio</a><a href="/contact" class="text-[#0066FF] font-medium">Contact</a><a href="https://wa.me/15102817365" class="px-5 py-2 bg-[#25D366] text-white rounded-full">WhatsApp</a></div>
            </div>
        </div>
    </nav>
    
    <section class="pt-32 pb-20">
        <div class="container mx-auto px-4 md:px-8">
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">Contactez-<span class="gradient-text">moi</span></h1>
                <p class="text-gray-600">Parlons de votre projet, je vous réponds sous 24h</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 max-w-4xl mx-auto">
                <div>
                    <div class="mb-6"><i class="fas fa-phone text-2xl text-[#0066FF] mb-2"></i><h3 class="font-bold">Téléphone / WhatsApp</h3><p class="text-gray-600">+1 510-281-7365</p></div>
                    <div class="mb-6"><i class="fas fa-envelope text-2xl text-[#0066FF] mb-2"></i><h3 class="font-bold">Email</h3><p class="text-gray-600">Emmanuelselicour.2002@gmail.com</p></div>
                    <div><i class="fas fa-clock text-2xl text-[#0066FF] mb-2"></i><h3 class="font-bold">Disponibilité</h3><p class="text-gray-600">Lundi - Samedi : 9h - 18h</p></div>
                </div>
                <div>
                    <form id="contactForm" class="bg-gray-50 rounded-2xl p-6">
                        <div class="mb-4"><input type="text" id="contactName" placeholder="Votre nom" required class="w-full px-4 py-3 rounded-xl border focus:border-[#0066FF] outline-none"></div>
                        <div class="mb-4"><input type="email" id="contactEmail" placeholder="Votre email" required class="w-full px-4 py-3 rounded-xl border focus:border-[#0066FF] outline-none"></div>
                        <div class="mb-4"><input type="tel" id="contactPhone" placeholder="Votre téléphone" class="w-full px-4 py-3 rounded-xl border focus:border-[#0066FF] outline-none"></div>
                        <div class="mb-4"><textarea id="contactMessage" rows="4" placeholder="Votre message" required class="w-full px-4 py-3 rounded-xl border focus:border-[#0066FF] outline-none"></textarea></div>
                        <button type="submit" class="w-full py-3 bg-[#0066FF] text-white rounded-xl font-bold hover:bg-[#0052cc] transition">Envoyer →</button>
                        <p id="formMessage" class="text-sm mt-3 text-center"></p>
                    </form>
                </div>
            </div>
        </div>
    </section>
    
    <footer class="bg-gray-900 text-white py-12 text-center">
        <p>© 2024 E.S Company</p>
    </footer>
    <a href="https://wa.me/15102817365" class="whatsapp-float"><i class="fab fa-whatsapp"></i></a>
    
    <script>
        document.getElementById('contactForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = { name: document.getElementById('contactName').value, email: document.getElementById('contactEmail').value, phone: document.getElementById('contactPhone').value, message: document.getElementById('contactMessage').value };
            const res = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(formData) });
            const data = await res.json();
            const msg = document.getElementById('formMessage');
            if (data.success) { msg.innerHTML = '✅ Message envoyé ! Je vous réponds rapidement.'; msg.classList.add('text-green-600'); document.getElementById('contactForm').reset(); }
            else { msg.innerHTML = '❌ Erreur, réessayez plus tard'; msg.classList.add('text-red-600'); }
            setTimeout(() => msg.innerHTML = '', 5000);
        });
    </script>
</body>
</html>
